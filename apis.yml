name: Locus Robotics
description: Locus Robotics is a warehouse-automation company that pairs autonomous mobile robots (AMRs)
  with an intelligent orchestration platform. Its robot line — Locus Array (Robots-to-Goods), Locus Origin,
  and Locus Vector — works alongside the LocusONE platform and the LocusHub business-intelligence engine
  to raise pick/putaway rates and reduce labor across distribution and fulfillment operations. LocusONE
  integrates with warehouse management systems (WMS) and ERP platforms through APIs delivered via the
  Locus Global Alliance Network partner program; the company also maintains 100+ open-source ROS robotics
  repositories on GitHub. There is no public self-serve developer portal or published API specification
  — integration is arranged through partners and direct engagement.
